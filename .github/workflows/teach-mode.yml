name: Teach Mode plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck -w @memmy/teach-mode-plugin
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: teach-mode-${{ matrix.os }}
          path: releases/
          if-no-files-found: error
