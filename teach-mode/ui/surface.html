<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:20px;color:#292b30;background:#faf9f6;font:14px/1.6 system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #d5d9de;border-radius:8px;padding:6px 12px;background:white;color:inherit}button:disabled{opacity:.5;cursor:default}button.primary{background:#386ad7;color:white;border-color:#386ad7}header,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h2{margin:0}p{margin:10px 0}.muted{color:#69707e;font-size:12px}article,.details{margin-top:12px;padding:14px;border:1px solid #ddd;border-radius:12px;background:white}label{display:block;margin:10px 0}input[type=text],input[type=url],textarea{width:100%;border:1px solid #cdd1d8;border-radius:7px;padding:8px;background:white}textarea{resize:vertical}#error{color:#b63232;white-space:pre-wrap}code,.path{overflow-wrap:anywhere}video,img{width:100%;max-height:340px;object-fit:contain;margin-top:12px}dialog{max-width:560px;width:92%;border:1px solid #ccd0d6;border-radius:12px;padding:20px}dialog::backdrop{background:#0005}.status{color:#3560b0}ol{padding-left:24px}
</style></head><body><header><h2>Teach Mode</h2><button id="new" class="primary">新建示范</button></header><p id="intro"></p><p id="error" role="alert"></p><div id="sessions"></div><section id="details"></section>
<dialog id="create"><form id="form"><h3 id="formTitle"></h3><p id="privacy" class="muted"></p><label><span id="titleLabel"></span><input id="title" type="text" maxlength="200" required></label><label><span id="urlLabel"></span><input id="url" type="url" placeholder="https://…" required></label><label><input id="consent" type="checkbox" required> <span id="consentLabel"></span></label><div class="actions"><button type="button" id="closeCreate"></button><button id="start" class="primary"></button></div></form></dialog>
<script>
const cn={new:'新建示范',intro:'在专用浏览器示范网页操作，选取输出，再切换到记事本。生成的技能可在对话中使用，每次执行读取网页的当前内容。',empty:'还没有教学示范。',title:'名称',url:'起始网页',consent:'我同意本次网页和记事本录制',start:'开始示范',close:'关闭',privacy:'本版仅支持 Windows、同一网站、单标签页及新建记事本文档。请先停止电脑历史或其他录制。示范保留原始可见画面与非密码输入，无音频，仅保存在本机。',defaultTitle:'网页内容记录到记事本',view:'查看',run:'执行',del:'删除示范',pick:'选取网页输出',desktop:'切换到记事本',finish:'完成示范',cancel:'停止当前任务',output:'选取的网页输出',copy:'复制文字',save:'将选取的输出填入已打开的记事本，按 Ctrl+S 保存，再完成示范。',web:'在专用浏览器操作到目标网页。点击“选取网页输出”，再点击要记录的段落或列表项。',export:'生成或重新注册技能',bundle:'下载技能包和说明',video:'查看示范视频',preview:'查看网页截图',verified:'已通过编辑器和文件双重校验',runNotice:'执行将打开浏览器并创建新的记事本文件。已有文件不会被覆盖。继续执行？',deleteNotice:'删除本次教学与录制证据？已生成的笔记文件会保留。',skill:'已生成技能，可在对话中请求执行：',unsupported:'当前系统不支持此版本的 Teach Mode。',loadFailed:'无法读取教学记录',retry:'重试记事本示范'};
const en={new:'New demonstration',intro:'Demonstrate in a dedicated browser, select the output, then switch to Notepad. Use the generated skill in chat to read the current web content on each run.',empty:'No demonstrations yet.',title:'Name',url:'Starting page',consent:'I consent to this web and Notepad recording',start:'Start demonstration',close:'Close',privacy:'Windows only: one website, one tab and a new Notepad document. Stop Computer History and other recordings first. Visible frames and non-secret input stay on this PC. No audio.',defaultTitle:'Save web content in Notepad',view:'View',run:'Run',del:'Delete demonstration',pick:'Select web output',desktop:'Switch to Notepad',finish:'Finish demonstration',cancel:'Stop current task',output:'Selected web output',copy:'Copy text',save:'Enter the selected output in the opened Notepad document, press Ctrl+S, then finish the demonstration.',web:'Demonstrate in the dedicated browser. Choose Select web output, then click the paragraph or list item to record.',export:'Generate or register skill',bundle:'Download skill and guide',video:'View demonstration video',preview:'View web screenshot',verified:'Verified in the editor and saved file',runNotice:'This opens a browser and creates a new Notepad file. Existing files will be preserved. Run now?',deleteNotice:'Delete this demonstration and its recording evidence? Generated note files are retained.',skill:'Skill ready; ask to run it in chat:',unsupported:'This Teach Mode version does not support this system.',loadFailed:'Could not load demonstrations',retry:'Retry Notepad demonstration'};
let t=cn, sessions=[], selected=null, busy=false, ready=false, mediaUrl=null, imageUrl=null;const pending=new Map();let sequence=0;
const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function request(type,body){return new Promise((resolve,reject)=>{const requestId=String(++sequence);pending.set(requestId,{resolve,reject});parent.postMessage({type,version:1,requestId,...body},'*');setTimeout(()=>{if(pending.has(requestId)){pending.delete(requestId);reject(new Error('Plugin request timed out'));}},330000);});}
async function invoke(action,extra={}){const response=await request('memmy.plugin.invoke',{capabilityId:'teach_manage',input:{action,...extra}});if(response.event.type==='error')throw new Error(response.event.message);return {output:response.event.output,artifacts:(response.events||[]).filter(e=>e.type==='artifact').map(e=>e.artifact)};}
async function refresh(){if(!ready)return;try{sessions=(await invoke('list')).output.sessions;render();}catch(e){$('error').textContent=e.message||t.loadFailed;}}
let lastRenderKey='';
function render(){
const renderKey=JSON.stringify([sessions,selected,busy,t.new,mediaUrl,imageUrl]);if(renderKey===lastRenderKey)return;lastRenderKey=renderKey;
 $('new').textContent=t.new;$('new').disabled=busy||sessions.some(s=>['starting','recording_web','switching','recording_desktop','running'].includes(s.state));$('intro').textContent=t.intro;
 $('sessions').innerHTML=sessions.length?sessions.map(s=>`<article><strong>${esc(s.title)}</strong> <span class="status">${esc(s.state)}</span><p class="muted">${esc(new Date(s.createdAt).toLocaleString())}</p><button data-action="view" data-id="${esc(s.id)}">${t.view}</button></article>`).join(''):`<p class="muted">${t.empty}</p>`;
 const s=sessions.find(s=>s.id===selected);if(!s){$('details').innerHTML='';return;}
 const button=(action,label)=>`<button data-action="${action}" data-id="${esc(s.id)}" ${busy?'disabled':''}>${label}</button>`;
 const active=['starting','recording_web','switching','recording_desktop','running'].includes(s.state),run=s.runs.at(-1);
 $('details').innerHTML=`<div class="details"><header><h3>${esc(s.title)}</h3>${button('hide',t.close)}</header><p>${esc(s.state)}</p>${s.error?`<p role="alert">${esc(s.error)}</p>`:''}${run?`<p>${esc(run.state)} ${run.uiReadbackMatched&&run.fileReadbackMatched?'✓ '+t.verified:''}</p><p class="path">${esc(run.file)}</p>${run.outputText?`<textarea readonly>${esc(run.outputText)}</textarea>`:''}`:''}${s.state==='recording_web'?`<p>${t.web}</p><div class="actions">${button('pick-output',t.pick)}${s.output?button('desktop',t.desktop):''}</div>`:''}${s.output?`<h4>${t.output}</h4><textarea readonly>${esc(s.output.text)}</textarea>${button('copy',t.copy)}${button('preview',t.preview)}`:''}${s.state==='recording_desktop'?`<p>${t.save}</p><p class="path">${esc(s.desktop?.file)}</p>${button('finish',t.finish)}`:''}${s.state==='failed'&&!s.planSha256&&s.output&&s.segments.length===1&&s.segments[0].state==='sealed'?button('desktop',t.retry):''}${active?button('cancel',t.cancel):''}${s.planSha256?`<p>${s.artifactExport?.state==='ready'?t.skill:''} <code>$${esc(s.artifactExport?.skillName||'')}</code></p><div class="actions">${!active?button('run',t.run):''}${button('export',t.export)}${s.artifactExport?.state==='ready'?button('bundle',t.bundle):''}</div>`:''}<div class="actions">${s.segments.some(x=>x.recordingId&&x.state!=='recording')?button('video',t.video):''}${!active?button('delete',t.del):''}</div><div id="media">${imageUrl?`<img alt="Web output evidence" src="${esc(imageUrl)}">`:''}${mediaUrl?`<video controls src="${esc(mediaUrl)}"></video>`:''}</div></div>`;
}
async function perform(fn){busy=true;$('error').textContent='';render();try{await fn();}catch(e){$('error').textContent=e.message;}finally{busy=false;await refresh();}}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;
 if(action==='view'){selected=id;mediaUrl=null;imageUrl=null;render();return;}if(action==='hide'){selected=null;render();return;}
 void perform(async()=>{const s=sessions.find(s=>s.id===id);if(action==='copy'){await request('memmy.plugin.copy',{text:s.output.text});return;}
 if(action==='run'&&!(await request('memmy.plugin.confirm',{message:t.runNotice})).accepted)return;if(action==='delete'&&!(await request('memmy.plugin.confirm',{message:t.deleteNotice})).accepted)return;
 const result=await invoke(action,{session_id:id,...(action==='run'?{consent:true,plan_sha256:s.planSha256}:{})});
 if(action==='preview')imageUrl=result.output.dataUrl;
 if(result.artifacts.length){const artifact=result.artifacts[0];if(action==='bundle')await request('memmy.plugin.artifact',{uri:artifact.downloadUri||artifact.uri,mode:'download',name:artifact.name});else if(action==='video'){const media=await request('memmy.plugin.artifact',{uri:artifact.uri,mode:'preview'});mediaUrl=media.url;}}
 });});
function labels(){for(const [id,key]of [['formTitle','new'],['privacy','privacy'],['titleLabel','title'],['urlLabel','url'],['consentLabel','consent'],['start','start'],['closeCreate','close']])$(id).textContent=t[key];render();}
$('new').onclick=()=>{$('title').value=t.defaultTitle;$('url').value='';$('consent').checked=false;labels();$('create').showModal();};$('closeCreate').onclick=()=>$('create').close();
$('form').onsubmit=event=>{event.preventDefault();void perform(async()=>{const s=(await invoke('start',{title:$('title').value.trim(),url:$('url').value.trim(),consent:$('consent').checked})).output;selected=s.id;$('create').close();});};
window.addEventListener('message',async event=>{if(event.source!==parent||event.data?.version!==1)return;const data=event.data;if(data.type==='memmy.plugin.context'){t=data.language==='en-US'?en:cn;if(!ready){ready=true;try{const c=(await invoke('configuration')).output;if(!c.supported){$('error').textContent=t.unsupported;$('new').disabled=true;return;}await refresh();}catch(e){$('error').textContent=e.message;}}labels();return;}const p=pending.get(data.requestId);if(p){pending.delete(data.requestId);data.ok?p.resolve(data.result):p.reject(new Error(data.error||'Plugin operation failed'));}});
setInterval(()=>{if(!busy)void refresh();},1500);labels();
</script></body></html>
